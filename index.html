<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="Cronômetro guiado para 5 séries de 30 repetições.">
  <title>Ritmo — Cronômetro de treino</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #14171c;
      --panel-2: #1b1f25;
      --ink: #f7f8f8;
      --muted: #9299a3;
      --line: #292e36;
      --accent: #ff5c35;
      --accent-soft: rgba(255,92,53,.15);
      --rest: #50d5b7;
      --rest-soft: rgba(80,213,183,.15);
      --series: #a88bff;
      --series-soft: rgba(168,139,255,.15);
      --shadow: 0 24px 80px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% -10%, rgba(255,92,53,.12), transparent 34rem),
        var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 760px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
      display: grid;
      align-content: center;
      gap: 18px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }

    .brand-mark {
      width: 12px;
      height: 28px;
      border-radius: 99px;
      background: var(--accent);
      box-shadow: 0 0 26px rgba(255,92,53,.45);
      transform: skew(-12deg);
    }

    .brand strong { font-size: 1.05rem; letter-spacing: -.02em; }
    .brand span { color: var(--muted); font-size: .86rem; display: block; margin-top: 1px; }

    .sound-button {
      min-width: 46px;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: var(--panel);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .18s ease, border-color .18s ease;
    }

    .sound-button:hover { border-color: #454c57; }
    .sound-button:active { transform: scale(.96); }
    .sound-button svg { width: 21px; height: 21px; }

    .timer-card {
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 6vw, 46px);
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(27,31,37,.97), rgba(15,17,21,.97));
      box-shadow: var(--shadow);
    }

    .timer-card::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      top: -180px;
      right: -130px;
      background: var(--phase-soft, var(--accent-soft));
      filter: blur(8px);
      pointer-events: none;
      transition: background .35s ease;
    }

    .phase-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 28px;
    }

    .phase-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 13px;
      border-radius: 999px;
      color: var(--phase-color, var(--accent));
      background: var(--phase-soft, var(--accent-soft));
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
      transition: color .3s ease, background .3s ease;
    }

    .phase-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 5px color-mix(in srgb, currentColor 16%, transparent);
    }

    .elapsed { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }

    .timer-wrap {
      position: relative;
      width: min(74vw, 340px);
      aspect-ratio: 1;
      margin: 0 auto 30px;
      display: grid;
      place-items: center;
    }

    .timer-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(var(--phase-color, var(--accent)) var(--progress, 0%), #282d34 0);
      transition: background .12s linear;
      filter: drop-shadow(0 0 22px var(--phase-soft, var(--accent-soft)));
    }

    .timer-ring::after {
      content: "";
      position: absolute;
      inset: 11px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 38%, #1c2026, #101216 72%);
      border: 1px solid rgba(255,255,255,.035);
    }

    .time-content {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .time {
      font-size: clamp(4rem, 17vw, 7.2rem);
      line-height: .9;
      letter-spacing: -.075em;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .time-label {
      margin-top: 16px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .metric {
      min-width: 0;
      padding: 15px 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.022);
      text-align: center;
    }

    .metric strong {
      display: block;
      font-size: clamp(1.08rem, 4.2vw, 1.45rem);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .metric span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .overall {
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
    }

    .overall-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 12px;
    }

    .overall-head strong { font-size: .92rem; }
    .overall-head span { color: var(--muted); font-size: .84rem; font-variant-numeric: tabular-nums; }

    .track {
      height: 9px;
      border-radius: 99px;
      background: #282d34;
      overflow: hidden;
    }

    .track > span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #ff896d);
      transition: width .35s ease;
    }

    .history {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 22px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
    }

    .history-copy { min-width: 0; }

    .history-kicker {
      display: block;
      margin-bottom: 5px;
      color: var(--accent);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .history-copy strong { display: block; font-size: 1rem; }
    .history-copy small { display: block; margin-top: 5px; color: var(--muted); font-size: .78rem; }

    .mark-done {
      min-height: 38px;
      margin-top: 12px;
      padding: 0 14px;
      border: 1px solid rgba(255,92,53,.38);
      border-radius: 11px;
      color: #ff8a6e;
      background: var(--accent-soft);
      font-size: .78rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .mark-done:hover { background: rgba(255,92,53,.23); border-color: rgba(255,92,53,.65); }
    .mark-done:active { transform: scale(.98); }

    .history-stats { display: grid; grid-template-columns: repeat(2, minmax(92px, 1fr)); gap: 8px; }

    .history-stat {
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.022);
      text-align: center;
    }

    .history-stat strong { display: block; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .history-stat span { display: block; margin-top: 3px; color: var(--muted); font-size: .67rem; font-weight: 700; text-transform: uppercase; }

    .controls { display: grid; grid-template-columns: 1fr auto; gap: 12px; }

    .primary, .secondary {
      min-height: 58px;
      border-radius: 17px;
      border: 0;
      cursor: pointer;
      font-weight: 800;
      transition: transform .18s ease, filter .18s ease, background .18s ease;
    }

    .primary {
      padding: 0 26px;
      color: white;
      background: var(--accent);
      box-shadow: 0 12px 30px rgba(255,92,53,.23);
    }

    .primary:hover { filter: brightness(1.08); }
    .primary:active, .secondary:active { transform: translateY(1px) scale(.99); }

    .secondary {
      width: 58px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: var(--panel-2);
      border: 1px solid var(--line);
    }

    .secondary:hover { background: #232830; }
    .secondary svg { width: 22px; height: 22px; }

    .hint { margin: -2px 0 0; color: var(--muted); text-align: center; font-size: .8rem; }

    .complete .timer-card { --phase-color: #ffd166; --phase-soft: rgba(255,209,102,.15); }
    .complete .primary { background: #d8a828; box-shadow: 0 12px 30px rgba(216,168,40,.22); }

    @media (max-width: 500px) {
      .app { align-content: start; padding-left: 14px; padding-right: 14px; }
      .timer-card { border-radius: 24px; padding: 22px 16px; }
      .timer-wrap { width: min(76vw, 300px); margin-bottom: 24px; }
      .metrics { gap: 7px; }
      .metric { padding: 13px 7px; }
      .metric span { font-size: .64rem; letter-spacing: .04em; }
      .history { grid-template-columns: 1fr; gap: 13px; }
      .history-stats { grid-template-columns: repeat(2, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header>
      <div class="brand">
        <i class="brand-mark" aria-hidden="true"></i>
        <div><strong>Ritmo</strong><span>Treino da manhã</span></div>
      </div>
      <button class="sound-button" id="soundButton" type="button" aria-label="Desativar avisos sonoros" aria-pressed="true"></button>
    </header>

    <section class="timer-card" id="timerCard" aria-live="polite">
      <div class="phase-row">
        <div class="phase-badge"><i class="phase-dot" aria-hidden="true"></i><span id="phaseName">Pronto</span></div>
        <span class="elapsed" id="elapsed">00:00</span>
      </div>

      <div class="timer-wrap">
        <div class="timer-ring" id="timerRing" aria-hidden="true"></div>
        <div class="time-content">
          <div class="time" id="time">00:10</div>
          <div class="time-label" id="timeLabel">Para começar</div>
        </div>
      </div>

      <div class="metrics">
        <div class="metric"><strong id="seriesMetric">1/5</strong><span>Série</span></div>
        <div class="metric"><strong id="repMetric">1/30</strong><span>Repetição</span></div>
        <div class="metric"><strong id="doneMetric">0/150</strong><span>Concluídas</span></div>
      </div>
    </section>

    <section class="overall" aria-label="Progresso total">
      <div class="overall-head"><strong>Progresso do treino</strong><span id="overallLabel">0%</span></div>
      <div class="track"><span id="overallBar"></span></div>
    </section>

    <section class="history" aria-label="Histórico de conclusões">
      <div class="history-copy">
        <span class="history-kicker">Consistência</span>
        <strong>Seu histórico</strong>
        <small id="todayStatus">Nenhuma conclusão registrada hoje</small>
        <button class="mark-done" id="markDoneButton" type="button">Adicionar conclusão de hoje</button>
      </div>
      <div class="history-stats">
        <div class="history-stat"><strong id="daysDone">0</strong><span>Conclusões</span></div>
        <div class="history-stat"><strong id="currentStreak">0</strong><span>Sequência em dias</span></div>
      </div>
    </section>

    <div class="controls">
      <button class="primary" id="mainButton" type="button">Começar treino</button>
      <button class="secondary" id="resetButton" type="button" aria-label="Reiniciar treino" title="Reiniciar treino">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
    <p class="hint">10s de execução · 5s de pausa · 2min entre séries</p>
  </main>

  <script>
    (() => {
      const CONFIG = Object.freeze({ series: 5, reps: 30, work: 10, shortRest: 5, seriesRest: 120 });
      const totalReps = CONFIG.series * CONFIG.reps;
      const app = document.querySelector('#app');
      const phaseName = document.querySelector('#phaseName');
      const timeEl = document.querySelector('#time');
      const timeLabel = document.querySelector('#timeLabel');
      const timerRing = document.querySelector('#timerRing');
      const seriesMetric = document.querySelector('#seriesMetric');
      const repMetric = document.querySelector('#repMetric');
      const doneMetric = document.querySelector('#doneMetric');
      const elapsedEl = document.querySelector('#elapsed');
      const overallLabel = document.querySelector('#overallLabel');
      const overallBar = document.querySelector('#overallBar');
      const daysDone = document.querySelector('#daysDone');
      const currentStreak = document.querySelector('#currentStreak');
      const todayStatus = document.querySelector('#todayStatus');
      const markDoneButton = document.querySelector('#markDoneButton');
      const mainButton = document.querySelector('#mainButton');
      const resetButton = document.querySelector('#resetButton');
      const soundButton = document.querySelector('#soundButton');

      let phase = 'ready';
      let series = 1;
      let rep = 1;
      let completed = 0;
      let phaseDuration = CONFIG.work;
      let remaining = CONFIG.work;
      let phaseEndsAt = 0;
      let startedAt = 0;
      let pausedAt = 0;
      let totalPaused = 0;
      let raf = 0;
      let soundOn = true;
      let audioContext = null;
      let wakeLock = null;

      const HISTORY_KEY = 'ritmo-completed-days-v1';

      function dateKey(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function completionRecords() {
        try {
          const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
          return saved.filter(day => /^\d{4}-\d{2}-\d{2}$/.test(day));
        } catch (_) {
          return [];
        }
      }

      function streakFor(days) {
        const completedSet = new Set(days);
        const cursor = new Date();
        if (!completedSet.has(dateKey(cursor))) {
          cursor.setDate(cursor.getDate() - 1);
          if (!completedSet.has(dateKey(cursor))) return 0;
        }
        let streak = 0;
        while (completedSet.has(dateKey(cursor))) {
          streak += 1;
          cursor.setDate(cursor.getDate() - 1);
        }
        return streak;
      }

      function renderHistory() {
        const records = completionRecords();
        const todayCount = records.filter(day => day === dateKey()).length;
        daysDone.textContent = records.length;
        currentStreak.textContent = streakFor(records);
        todayStatus.textContent = todayCount === 0
          ? 'Nenhuma conclusão registrada hoje'
          : `${todayCount} ${todayCount === 1 ? 'conclusão registrada' : 'conclusões registradas'} hoje`;
      }

      function recordToday() {
        const records = completionRecords();
        records.push(dateKey());
        localStorage.setItem(HISTORY_KEY, JSON.stringify(records));
        renderHistory();
      }

      const icons = {
        on: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
        off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>'
      };

      function format(seconds) {
        const safe = Math.max(0, Math.ceil(seconds));
        return `${String(Math.floor(safe / 60)).padStart(2, '0')}:${String(safe % 60).padStart(2, '0')}`;
      }

      function beep(type = 'normal') {
        if (!soundOn) return;
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          if (audioContext.state === 'suspended') audioContext.resume();
          const now = audioContext.currentTime;
          const notes = type === 'done' ? [523, 659, 784] : type === 'rest' ? [440, 330] : [660];
          notes.forEach((frequency, index) => {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const start = now + index * .13;
            osc.type = 'sine';
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(.0001, start);
            gain.gain.exponentialRampToValueAtTime(.16, start + .015);
            gain.gain.exponentialRampToValueAtTime(.0001, start + .11);
            osc.connect(gain).connect(audioContext.destination);
            osc.start(start);
            osc.stop(start + .12);
          });
        } catch (_) {}
      }

      async function requestWakeLock() {
        if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
      }

      function setPhase(next, duration, anchor = performance.now()) {
        phase = next;
        phaseDuration = duration;
        remaining = duration;
        phaseEndsAt = anchor + duration * 1000;
      }

      function advance(anchor) {
        if (phase === 'work') {
          completed += 1;
          if (completed >= totalReps) {
            phase = 'complete';
            remaining = 0;
            beep('done');
            if (wakeLock) wakeLock.release().catch(() => {});
            recordToday();
            return;
          }
          if (rep < CONFIG.reps) {
            setPhase('shortRest', CONFIG.shortRest, anchor);
            beep('rest');
          } else {
            setPhase('seriesRest', CONFIG.seriesRest, anchor);
            beep('rest');
          }
        } else if (phase === 'shortRest') {
          rep += 1;
          setPhase('work', CONFIG.work, anchor);
          beep();
        } else if (phase === 'seriesRest') {
          series += 1;
          rep = 1;
          setPhase('work', CONFIG.work, anchor);
          beep();
        }
      }

      function tick(now) {
        if (!['work', 'shortRest', 'seriesRest'].includes(phase)) return;
        while (now >= phaseEndsAt && phase !== 'complete') {
          const anchor = phaseEndsAt;
          advance(anchor);
        }
        if (phase !== 'complete') remaining = Math.max(0, (phaseEndsAt - now) / 1000);
        render();
        if (phase !== 'complete') raf = requestAnimationFrame(tick);
      }

      function start() {
        if (phase === 'ready') {
          startedAt = performance.now();
          totalPaused = 0;
          setPhase('work', CONFIG.work, startedAt);
          beep();
          requestWakeLock();
          raf = requestAnimationFrame(tick);
        } else if (phase === 'paused') {
          const now = performance.now();
          totalPaused += now - pausedAt;
          phase = app.dataset.pausedPhase;
          phaseEndsAt = now + remaining * 1000;
          requestWakeLock();
          beep();
          raf = requestAnimationFrame(tick);
        }
        render();
      }

      function pause() {
        if (!['work', 'shortRest', 'seriesRest'].includes(phase)) return;
        cancelAnimationFrame(raf);
        remaining = Math.max(0, (phaseEndsAt - performance.now()) / 1000);
        app.dataset.pausedPhase = phase;
        phase = 'paused';
        pausedAt = performance.now();
        if (wakeLock) wakeLock.release().catch(() => {});
        render();
      }

      function reset() {
        cancelAnimationFrame(raf);
        if (wakeLock) wakeLock.release().catch(() => {});
        phase = 'ready';
        series = 1;
        rep = 1;
        completed = 0;
        phaseDuration = CONFIG.work;
        remaining = CONFIG.work;
        phaseEndsAt = 0;
        startedAt = 0;
        totalPaused = 0;
        app.classList.remove('complete');
        render();
      }

      function render() {
        const viewPhase = phase === 'paused' ? app.dataset.pausedPhase : phase;
        const data = {
          ready: ['Pronto', 'Para começar', 'var(--accent)', 'var(--accent-soft)'],
          work: ['Executando', 'Segundos restantes', 'var(--accent)', 'var(--accent-soft)'],
          shortRest: ['Pausa curta', 'Próxima repetição', 'var(--rest)', 'var(--rest-soft)'],
          seriesRest: ['Descanso da série', 'Próxima série', 'var(--series)', 'var(--series-soft)'],
          complete: ['Treino concluído', 'Bom trabalho', '#ffd166', 'rgba(255,209,102,.15)']
        }[viewPhase] || ['Pausado', 'Toque para continuar', '#f5f5f5', 'rgba(255,255,255,.1)'];

        document.documentElement.style.setProperty('--phase-color', data[2]);
        document.documentElement.style.setProperty('--phase-soft', data[3]);
        phaseName.textContent = phase === 'paused' ? 'Pausado' : data[0];
        timeLabel.textContent = phase === 'paused' ? 'Toque para continuar' : data[1];
        timeEl.textContent = phase === 'complete' ? '✓' : format(remaining);
        const phaseProgress = phase === 'ready' ? 0 : phase === 'complete' ? 100 : (1 - remaining / phaseDuration) * 100;
        timerRing.style.setProperty('--progress', `${Math.max(0, Math.min(100, phaseProgress))}%`);
        seriesMetric.textContent = `${series}/${CONFIG.series}`;
        repMetric.textContent = `${rep}/${CONFIG.reps}`;
        doneMetric.textContent = `${completed}/${totalReps}`;
        const overall = completed / totalReps * 100;
        overallBar.style.width = `${overall}%`;
        overallLabel.textContent = `${Math.round(overall)}%`;

        if (startedAt) {
          const end = phase === 'paused' ? pausedAt : performance.now();
          elapsedEl.textContent = format((end - startedAt - totalPaused) / 1000);
        } else elapsedEl.textContent = '00:00';

        mainButton.textContent = phase === 'ready' ? 'Começar treino' : phase === 'paused' ? 'Continuar treino' : phase === 'complete' ? 'Treinar novamente' : 'Pausar';
        app.classList.toggle('complete', phase === 'complete');
      }

      mainButton.addEventListener('click', () => {
        if (phase === 'complete') reset();
        else if (['ready', 'paused'].includes(phase)) start();
        else pause();
      });

      resetButton.addEventListener('click', reset);
      markDoneButton.addEventListener('click', recordToday);
      soundButton.addEventListener('click', () => {
        soundOn = !soundOn;
        soundButton.innerHTML = soundOn ? icons.on : icons.off;
        soundButton.setAttribute('aria-pressed', String(soundOn));
        soundButton.setAttribute('aria-label', soundOn ? 'Desativar avisos sonoros' : 'Ativar avisos sonoros');
        if (soundOn) beep();
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && ['work', 'shortRest', 'seriesRest'].includes(phase)) requestWakeLock();
      });

      soundButton.innerHTML = icons.on;
      renderHistory();
      render();
    })();
  </script>
</body>
</html>
